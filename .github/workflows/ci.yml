name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck db-backup install.sh

      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^VERSION=//p' db-backup)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION=$version"; exit 1; }
